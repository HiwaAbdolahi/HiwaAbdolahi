<svg xmlns="http://www.w3.org/2000/svg" width="720" height="445" viewBox="0 0 720 445" role="img"><title>Your next idea. Let's build it.</title><defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#091b21"/><stop offset=".58" stop-color="#07171e"/><stop offset="1" stop-color="#102b30"/></linearGradient>
<radialGradient id="halo"><stop stop-color="#5ccdb4" stop-opacity=".25"/><stop offset=".5" stop-color="#3999a0" stop-opacity=".08"/><stop offset="1" stop-color="#091b21" stop-opacity="0"/></radialGradient>
<linearGradient id="mint"><stop stop-color="#edffe8"/><stop offset=".42" stop-color="#96f2cd"/><stop offset="1" stop-color="#66adc0"/></linearGradient>
<linearGradient id="glass" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#204d50" stop-opacity=".8"/><stop offset=".55" stop-color="#102e35" stop-opacity=".92"/><stop offset="1" stop-color="#153841" stop-opacity=".75"/></linearGradient>
<linearGradient id="edge" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#b4fada"/><stop offset=".45" stop-color="#62918e"/><stop offset="1" stop-color="#152e37"/></linearGradient>
