<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="490" viewBox="0 0 1200 490" role="img"><title>SmartEnergy message loop — dashboard, MQTT broker and .NET worker</title><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#091b21"/><stop offset="1" stop-color="#112f34"/></linearGradient><radialGradient id="halo"><stop stop-color="#96f2cd" stop-opacity=".1"/><stop offset="1" stop-color="#96f2cd" stop-opacity="0"/></radialGradient></defs><style>text{font-family:Arial,Helvetica,sans-serif}.mono{font-family:monospace;letter-spacing:1.5px}.packet{stroke-dasharray:12 388;animation:packet 9s linear infinite}.pulse{animation:pulse 6s ease-in-out infinite}@keyframes packet{to{stroke-dashoffset:-800}}@keyframes pulse{0%,100%{opacity:.45}50%{opacity:1}}@media(prefers-reduced-motion:reduce){.packet,.pulse{animation:none}}</style><rect width="1200" height="490" rx="24" fill="url(#bg)"/><rect x="1" y="1" width="1198" height="488" rx="23" fill="none" stroke="#35504f"/><text x="40" y="42" font-size="12" fill="#96f2cd" class="mono">INSIDE SMARTENERGY / DOCUMENTED MESSAGE FLOW</text><text x="38" y="95" font-size="38" fill="#f3efdf" font-weight="700">One reading. A complete round trip.</text><text x="40" y="134" font-size="18" fill="#a4b7b4" >Example: 20.5°C → the worker publishes a heater ON command.</text><rect x="40" y="207" width="286" height="115" rx="14" fill="#0b232a" stroke="#5a8c7b"/><circle cx="66" cy="233" r="4" fill="#96f2cd"/><text x="82" y="238" font-size="11" fill="#96f2cd" class="mono">01 / INTERFACE</text><text x="62" y="273" font-size="23" fill="#f3efdf" font-weight="700">Dashboard</text><text x="62" y="301" font-size="15" fill="#a4b7b4" >HTML / JavaScript / Chart.js</text><rect x="457" y="207" width="286" height="115" rx="14" fill="#0b232a" stroke="#5a8c7b"/><circle cx="483" cy="233" r="4" fill="#96f2cd"/><text x="499" y="238" font-size="11" fill="#96f2cd" class="mono">02 / MESSAGING</text><text x="479" y="273" font-size="23" fill="#f3efdf" font-weight="700">MQTT broker</text><text x="479" y="301" font-size="15" fill="#a4b7b4" >Eclipse Mosquitto</text><rect x="874" y="207" width="286" height="115" rx="14" fill="#0b232a" stroke="#5a8c7b"/><circle cx="900" cy="233" r="4" fill="#96f2cd"/><text x="916" y="238" font-size="11" fill="#96f2cd" class="mono">03 / LOGIC</text><text x="896" y="273" font-size="23" fill="#f3efdf" font-weight="700">.NET worker</text><text x="896" y="301" font-size="15" fill="#a4b7b4" >BackgroundService / MQTTnet</text><path d="M326 240H457M743 240H874" stroke="#96f2cd" fill="none"/><path d="M326 240H457M743 240H874" class="packet" stroke="#f0d6ab" stroke-width="3" fill="none"/><path d="M449 236L457 240 449 244M866 236L874 240 866 244" fill="none" stroke="#96f2cd"/><text x="391" y="215" font-size="12" fill="#a4b7b4" text-anchor="middle">temperature</text><text x="808" y="215" font-size="12" fill="#a4b7b4" text-anchor="middle">deliver reading</text><path d="M874 294H743M457 294H326" stroke="#d7c298" fill="none"/><path d="M874 294H743M457 294H326" class="packet" stroke="#f3efdf" stroke-width="3" fill="none"/><path d="M751 290L743 294 751 298M334 290L326 294 334 298" fill="none" stroke="#d7c298"/><text x="391" y="347" font-size="12" fill="#d7c298" text-anchor="middle">update interface</text><text x="808" y="347" font-size="12" fill="#d7c298" text-anchor="middle">heater command</text><path d="M40 382h1120" stroke="#34504e"/><text x="40" y="418" font-size="11" fill="#96f2cd" class="mono">RUN LOCALLY</text><text x="40" y="450" font-size="17" fill="#a4b7b4" >Docker Compose · three containers</text><text x="635" y="418" font-size="11" fill="#96f2cd" class="mono">DEPLOY TO AZURE</text><text x="635" y="450" font-size="17" fill="#a4b7b4" >GitHub Actions → ACR → Container Apps</text></svg>