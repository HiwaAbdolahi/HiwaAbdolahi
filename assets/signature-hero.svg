<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="740" viewBox="0 0 1440 740" role="img" aria-labelledby="title desc"><title id="title">Hiwa Abdolahi — the craft of connected software</title><desc id="desc">Bespoke animated artwork for Hiwa Abdolahi. Sculptural glass layers and flowing connections, in mint and warm ivory. Decorative animation, not live system data.</desc><defs>
