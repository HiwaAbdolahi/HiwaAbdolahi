<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc">
  <title id="title">Hiwa Abdolahi — Software Developer</title>
  <desc id="desc">A premium dark technology banner inspired by cloud, real-time data and connected systems.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#07111f"/>
      <stop offset="0.48" stop-color="#0b1f3a"/>
      <stop offset="1" stop-color="#071525"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#38bdf8" stop-opacity=".36"/>
      <stop offset="1" stop-color="#38bdf8" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#38bdf8"/>
      <stop offset=".5" stop-color="#60a5fa"/>
      <stop offset="1" stop-color="#8b5cf6"/>
    </linearGradient>
    <filter id="soft"><feGaussianBlur stdDeviation="18"/></filter>
    <filter id="shadow"><feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000" flood-opacity=".42"/></filter>
    <pattern id="grid" width="42" height="42" patternUnits="userSpaceOnUse">
      <path d="M42 0H0V42" fill="none" stroke="#7dd3fc" stroke-opacity=".055"/>
    </pattern>
  </defs>

  <rect width="1200" height="360" rx="28" fill="url(#bg)"/>
  <rect width="1200" height="360" rx="28" fill="url(#grid)"/>
  <ellipse cx="920" cy="150" rx="320" ry="250" fill="url(#glow)" filter="url(#soft)"/>
  <ellipse cx="170" cy="350" rx="270" ry="120" fill="#7c3aed" opacity=".12" filter="url(#soft)"/>

  <g opacity=".7" fill="none" stroke="#38bdf8">
    <path d="M770 105C845 70 902 112 960 89S1074 65 1142 104" stroke-opacity=".22"/>
    <path d="M760 182C828 141 885 213 948 169S1060 132 1145 183" stroke-opacity=".31"/>
    <path d="M790 255C850 220 904 271 970 235S1080 224 1143 259" stroke-opacity=".2"/>
    <g fill="#7dd3fc" stroke="none">
      <circle cx="770" cy="105" r="4"><animate attributeName="opacity" values=".35;1;.35" dur="2.8s" repeatCount="indefinite"/></circle>
      <circle cx="960" cy="89" r="5"><animate attributeName="r" values="4;7;4" dur="3.1s" repeatCount="indefinite"/></circle>
      <circle cx="1142" cy="104" r="4"/>
      <circle cx="760" cy="182" r="5"/>
      <circle cx="948" cy="169" r="6"><animate attributeName="opacity" values="1;.35;1" dur="2.5s" repeatCount="indefinite"/></circle>
      <circle cx="1145" cy="183" r="4"/>
      <circle cx="790" cy="255" r="4"/>
      <circle cx="970" cy="235" r="5"><animate attributeName="r" values="4;7;4" dur="3.6s" repeatCount="indefinite"/></circle>
      <circle cx="1143" cy="259" r="4"/>
    </g>
  </g>

  <g filter="url(#shadow)">
    <rect x="65" y="62" width="82" height="7" rx="3.5" fill="url(#accent)"/>
    <text x="65" y="135" fill="#f8fafc" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="56" font-weight="750" letter-spacing="-1">Hiwa Abdolahi</text>
    <text x="68" y="178" fill="#93c5fd" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="23" font-weight="600" letter-spacing="1.2">SOFTWARE DEVELOPER</text>
    <text x="68" y="224" fill="#cbd5e1" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="20">Building cloud-connected, data-driven systems</text>
    <text x="68" y="269" fill="#7dd3fc" font-family="JetBrains Mono,Consolas,monospace" font-size="17">.NET  •  Azure  •  IoT  •  Real-time  •  Applied AI</text>
    <text x="68" y="310" fill="#64748b" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15">Drammen, Norway  ·  M.Sc. Informatics @ USN</text>
  </g>
  <rect x="1" y="1" width="1198" height="358" rx="27" fill="none" stroke="url(#accent)" stroke-opacity=".35" stroke-width="2"/>
</svg>
