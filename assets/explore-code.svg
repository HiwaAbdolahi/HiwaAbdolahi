<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="204" viewBox="0 0 1200 204" role="img"><title>Explore my repositories on GitHub</title><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#091b21"/><stop offset="1" stop-color="#112d32"/></linearGradient><linearGradient id="line"><stop stop-color="#e2cc9b"/><stop offset="1" stop-color="#96f2cd"/></linearGradient><radialGradient id="light"><stop stop-color="#73d9b7" stop-opacity=".14"/><stop offset="1" stop-color="#091b21" stop-opacity="0"/></radialGradient></defs><style>text{font-family:Arial,Helvetica,sans-serif}.mono{font-family:monospace;letter-spacing:1.5px}.ivory{fill:#f3efdf}.muted{fill:#a1b6b2}.mint{fill:#96f2cd}.gold{fill:#e2cc9b}.travel{stroke-dasharray:12 160;animation:travel 8s linear infinite}.pulse{animation:pulse 5s ease-in-out infinite}@keyframes travel{to{stroke-dashoffset:-344}}@keyframes pulse{0%,100%{opacity:.4}50%{opacity:1}}@media(prefers-reduced-motion:reduce){.travel,.pulse{animation:none}}</style><rect width="1200" height="204" rx="20" fill="url(#bg)"/><text x="38" y="43" class="mint mono" font-size="12">EXPLORE THE IMPLEMENTATION</text><text x="36" y="101" class="ivory" font-size="38" font-weight="700" letter-spacing="-1">The work behind the profile.</text><text x="38" y="143" class="muted" font-size="19">Source code, project documentation and commit history — on GitHub.</text><g transform="translate(1034 98)" fill="none" stroke="#96f2cd" stroke-width="2"><path d="M-52-24L-76 0-52 24M22-24L46 0 22 24M-5-35L-29 35"/><path d="M87 18V-13H56M87-13L57 17" opacity=".5"/></g><rect x="1" y="1" width="1198" height="202" rx="19" fill="none" stroke="#304b4d"/></svg>